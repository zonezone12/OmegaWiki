model:
  checkpoint: checkpoints/gfn_fad.pt
  cutoff: 5.0
  n_interactions: 3
output:
  checkpoint_stride: 10000
  colvar_file: results/colvar.dat
  colvar_stride: 10
  hills_file: results/hills.dat
  traj_stride: 500
pimd:
  friction: 1.0
  n_beads: 4
  n_steps: 5000
  seed: 42
  temperature: 200.0
  thermostat: PILE-L
  timestep: 0.5
sanity:
  check_cv: true
  n_steps: 100
system:
  n_atoms: 10
  name: formic_acid_dimer
wt_metad:
  biasfactor: 10
  cv: CVdimer
  cv_bins: 300
  cv_max: 1.5
  cv_min: -1.5
  height: 1.0
  sigma: 0.05
  stride: 100
